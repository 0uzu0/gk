# ============================================================================
#  docker-compose.yml  ——  通用部署模板
#  作用：从 Docker Hub 拉取镜像并启动容器，一条命令完成部署
#
#  使用步骤：
#    1. 把下方 image: 的占位符替换成你的镜像（Docker Hub 镜像名）
#       格式：仓库/镜像名:标签      例如 nginx:alpine 、 nextcloud:28
#    2. 按需调整 ports（端口）、volumes（数据卷）、environment（环境变量）
#    3. 启动：  docker compose up -d
#    4. 看状态：docker compose ps
#    5. 看日志：docker compose logs -f
#    6. 停止：  docker compose down        （容器+网络会删除，数据卷保留）
#
#  说明：本文件适用于 Docker Compose v2（命令为 docker compose，无连字符）
# ============================================================================

services:
  app:
    # ★★★ 必改：替换成你要部署的镜像 ★★★
    image: yourname/your-image:latest        # 例：nginx:alpine

    # 可选：自定义容器名（不写则自动生成）
    container_name: my-app

    # 端口映射  「宿主机端口:容器端口」
    ports:
      - "8080:80"            # 访问 http://localhost:8080 即进入容器内 80 端口

    # 数据持久化  「宿主机路径:容器路径」—— 重启/重建不丢数据
    volumes:
      - ./data:/data         # 容器内 /data 的数据会保存到本机 ./data 目录

    # 环境变量（常见项：时区、密钥等）
    environment:
      - TZ=Asia/Shanghai
      # - API_KEY=你的密钥

    # 敏感信息建议放同目录的 .env 文件，避免写进这里
    # env_file:
    #   - .env

    # 重启策略：容器异常退出或宿主机重启后自动拉起
    restart: unless-stopped

    # ===== 以下为可选增强，需要时取消注释 =====

    # 健康检查：容器内服务就绪后标记为 healthy
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:80"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3

    # 资源限制
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512m

    # 日志滚动（防止日志无限增长）
    # logging:
    #   driver: json-file
    #   options:
    #     max-size: "10m"
    #     max-file: "3"
